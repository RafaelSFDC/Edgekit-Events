<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudflare Realtime - Teste Pusher Clone</title>
  <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p.subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.9rem;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .btn-secondary {
      background: #334155;
    }
    .btn-secondary:hover { background: #475569; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .badge-connected { background: #065f46; color: #34d399; }
    .badge-disconnected { background: #881337; color: #f43f5e; }
    .log-box {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 14px;
      font-family: monospace;
      font-size: 0.85rem;
      height: 260px;
      overflow-y: auto;
      color: #a5f3fc;
    }
    .log-entry { margin-bottom: 6px; word-break: break-all; }
    .log-time { color: #64748b; }
    .log-highlight { color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📡 Cloudflare Realtime</h1>
    <p class="subtitle">Teste em tempo real com o SDK oficial <code>pusher-js</code> conectado ao Cloudflare Worker.</p>

    <!-- Conexão -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0;">1. Configurações de Conexão</h3>
        <span id="connectionBadge" class="badge badge-disconnected">Desconectado</span>
      </div>

      <div class="grid">
        <div>
          <label>Host do Worker (wsHost/httpHost):</label>
          <input type="text" id="hostInput" value="localhost:8787" />
        </div>
        <div>
          <label>App Key:</label>
          <input type="text" id="keyInput" value="key-default" />
        </div>
        <div>
          <label>Porta:</label>
          <input type="number" id="portInput" value="8787" />
        </div>
        <div>
          <label>TLS / HTTPS:</label>
          <select id="tlsSelect" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #f8fafc;">
            <option value="false">Não (Localhost HTTP/WS)</option>
            <option value="true">Sim (Produção HTTPS/WSS)</option>
          </select>
        </div>
      </div>

      <div style="display: flex; gap: 10px;">
        <button id="connectBtn" class="btn" onclick="toggleConnect()">Conectar</button>
      </div>
    </div>

    <!-- Canal e Eventos -->
    <div class="card">
      <h3 style="margin-top: 0;">2. Assinar Canal & Disparar Teste</h3>
      <div class="grid">
        <div>
          <label>Canal:</label>
          <input type="text" id="channelInput" value="pedidos" />
        </div>
        <div>
          <label>Evento:</label>
          <input type="text" id="eventInput" value="novo-pedido" />
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-bottom: 16px;">
        <button class="btn btn-secondary" onclick="subscribeChannel()">Assinar Canal</button>
        <button class="btn" onclick="triggerTestEvent()">Disparar Evento via REST API</button>
      </div>
    </div>

    <!-- Logs -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="margin: 0;">3. Registro de Eventos Recebidos (Logs)</h3>
        <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="clearLogs()">Limpar</button>
      </div>
      <div id="logBox" class="log-box"></div>
    </div>
  </div>

  <script>
    let pusher = null;
    let currentChannel = null;

    function log(msg, highlight = false) {
      const box = document.getElementById("logBox");
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      div.className = "log-entry";
      div.innerHTML = `<span class="log-time">[${time}]</span> ${highlight ? `<span class="log-highlight">${msg}</span>` : msg}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function clearLogs() {
      document.getElementById("logBox").innerHTML = "";
    }

    function toggleConnect() {
      if (pusher) {
        pusher.disconnect();
        pusher = null;
        document.getElementById("connectBtn").innerText = "Conectar";
        document.getElementById("connectionBadge").innerText = "Desconectado";
        document.getElementById("connectionBadge").className = "badge badge-disconnected";
        log("Desconectado do servidor.");
        return;
      }

      const host = document.getElementById("hostInput").value.trim();
      const key = document.getElementById("keyInput").value.trim();
      const port = parseInt(document.getElementById("portInput").value, 10);
      const isTLS = document.getElementById("tlsSelect").value === "true";

      log(`Iniciando conexão Pusher para ${host} (App Key: ${key})...`);

      pusher = new Pusher(key, {
        wsHost: host,
        httpHost: host,
        wsPort: port,
        wssPort: port,
        forceTLS: isTLS,
        disableStats: true,
        enabledTransports: ["ws", "wss"]
      });

      pusher.connection.bind("connected", () => {
        document.getElementById("connectBtn").innerText = "Desconectar";
        document.getElementById("connectionBadge").innerText = "Conectado";
        document.getElementById("connectionBadge").className = "badge badge-connected";
        log(`Conectado com sucesso! Socket ID: ${pusher.connection.socket_id}`, true);
        subscribeChannel();
      });

      pusher.connection.bind("disconnected", () => {
        document.getElementById("connectBtn").innerText = "Conectar";
        document.getElementById("connectionBadge").innerText = "Desconectado";
        document.getElementById("connectionBadge").className = "badge badge-disconnected";
        log("Conexão encerrada.");
      });

      pusher.connection.bind("error", (err) => {
        log(`Erro de conexão: ${JSON.stringify(err)}`);
      });
    }

    function subscribeChannel() {
      if (!pusher) {
        alert("Conecte-se primeiro!");
        return;
      }

      const channelName = document.getElementById("channelInput").value.trim();
      const eventName = document.getElementById("eventInput").value.trim();

      if (currentChannel) {
        pusher.unsubscribe(currentChannel.name);
      }

      log(`Assinando canal "${channelName}"...`);
      currentChannel = pusher.subscribe(channelName);

      currentChannel.bind("pusher:subscription_succeeded", () => {
        log(`Inscrito com sucesso no canal "${channelName}"!`, true);
      });

      currentChannel.bind(eventName, (data) => {
        log(`⚡ [EVENTO RECEBIDO] Canal: "${channelName}" | Evento: "${eventName}" | Dados: ${JSON.stringify(data)}`, true);
      });
    }

    async function triggerTestEvent() {
      const host = document.getElementById("hostInput").value.trim();
      const channel = document.getElementById("channelInput").value.trim();
      const event = document.getElementById("eventInput").value.trim();
      const isTLS = document.getElementById("tlsSelect").value === "true";

      const protocol = isTLS ? "https://" : "http://";
      const url = `${protocol}${host}/api/v1/trigger`;

      log(`Disparando evento de teste para ${url}...`);

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer secret-default"
          },
          body: JSON.stringify({
            channel,
            event,
            data: {
              mensagem: "Olá do Cloudflare Realtime!",
              pedido_id: Math.floor(Math.random() * 90000 + 10000),
              timestamp: new Date().toISOString()
            }
          })
        });

        const result = await res.json();
        log(`Resultado do disparo: ${JSON.stringify(result)}`);
      } catch (err) {
        log(`Erro ao disparar evento: ${err.message}`);
      }
    }
  </script>
</body>
</html>
